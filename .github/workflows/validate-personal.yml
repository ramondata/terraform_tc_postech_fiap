name: Validate personal AWS environment
on:
  pull_request:
    paths: [modules/personal/**, env/personal/**, scripts/personal.sh, scripts/install-tools.sh, scripts/unlock-personal.sh, scripts/recover-personal-state.py, scripts/test_personal_recovery.py, .github/workflows/validate-personal.yml]
  push:
    branches: [main]
    paths: [modules/personal/**, env/personal/**, scripts/personal.sh, scripts/install-tools.sh, scripts/unlock-personal.sh, scripts/recover-personal-state.py, scripts/test_personal_recovery.py, .github/workflows/validate-personal.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Terraform and Terragrunt
        run: |
          bash scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Syntax and formatting
        run: |
          python3 -m unittest discover -s scripts -p test_personal_recovery.py -v
          bash -n scripts/personal.sh scripts/install-tools.sh scripts/unlock-personal.sh
          shellcheck --severity=warning scripts/personal.sh scripts/install-tools.sh scripts/unlock-personal.sh
          terraform fmt -check -diff modules/personal
      - name: Validate and plan with mock AWS provider
        working-directory: modules/personal
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test -no-color
      - name: Validate Terragrunt 1.2.2 configuration
        working-directory: env/personal
        env:
          PERSONAL_REGION: us-east-2
          PERSONAL_STATE_BUCKET: test-only-personal-state
          PERSONAL_EKS_VERSION: '1.36'
          PERSONAL_RDS_VERSION: '16.10'
        run: |
          export TG_TF_PATH="$(command -v terraform)"
          terragrunt hcl validate
