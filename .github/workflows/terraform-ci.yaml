#Vai dar certo
name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      AWS_ROLE_ARN:
        description: "ARN do papel (role) utilizado pelo GitHub Actions"
        required: true
        type: string
      AWS_OIDC_PROVIDER_ARN:
        description: "ARN do OIDC Provider utilizado pelo GitHub Actions"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  AWS_OIDC_PROVIDER_ARN: ${{ inputs.AWS_OIDC_PROVIDER_ARN }}
  AWS_ROLE_ARN: ${{ inputs.AWS_ROLE_ARN }}


jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: env/dev

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # --------------------------------------------------
      # Setup Terragrunt
      # --------------------------------------------------

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: latest

      # --------------------------------------------------
      # Terraform Format
      # --------------------------------------------------

      - name: Terraform Format
        working-directory: .
        run: terraform fmt -check -recursive


      # --------------------------------------------------
      # Terragrunt Init
      # --------------------------------------------------

      - name: Terragrunt Init
        run: terragrunt init

      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------

      - name: Terragrunt Validate
        run: terragrunt validate


      # --------------------------------------------------
      # Setup TFLint
      # --------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v1


      # --------------------------------------------------
      # TFLint
      # --------------------------------------------------

      - name: Initialize TFLint
        working-directory: .
        run: tflint --init


      - name: Run TFLint
        working-directory: .
        run: tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --recursive

      # --------------------------------------------------
      # Checkov
      # --------------------------------------------------

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false
          skip_check: CK*


      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        run: terragrunt plan -input=false
