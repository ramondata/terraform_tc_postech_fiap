#Vai dar certo
name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      AWS_ACCESS_KEY_ID:
        description: "Passe o AWS_ACCESS_KEY_ID do usuário que possui permissão para assumir o role do laboratório"
        required: true
        type: string
      AWS_SECRET_ACCESS_KEY:
        description: "Passe o AWS_SECRET_ACCESS_KEY do usuário que possui permissão para assumir o role do laboratório"
        required: true
        type: string
      AWS_SESSION_TOKEN:
        description: "Passe o AWS_SESSION_TOKEN do usuário que possui permissão para assumir o role do laboratório"
        required: true
        type: string
      LAB_ROLE:
        description: "Passe o ARN do role do laboratório"
        required: true
        type: string
      BUCKET_NAME:
        description: "Nome do bucket S3 para armazenar o Terraform state"
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  LAB_ROLE: ${{ inputs.LAB_ROLE }}
  BUCKET_NAME: ${{ inputs.BUCKET_NAME }}

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: env/dev

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Mask AWS credentials
        run: |
          echo "::add-mask::${{ inputs.AWS_ACCESS_KEY_ID }}"
          echo "::add-mask::${{ inputs.AWS_SECRET_ACCESS_KEY }}"
          echo "::add-mask::${{ inputs.AWS_SESSION_TOKEN }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ inputs.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      # --------------------------------------------------
      # Setup Terragrunt
      # --------------------------------------------------

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: latest

      # --------------------------------------------------
      # Terraform Format
      # --------------------------------------------------

      - name: Terraform Format
        working-directory: .
        run: terraform fmt -check -recursive


      # --------------------------------------------------
      # Terragrunt Init
      # --------------------------------------------------

      - name: Terragrunt Init
        run: terragrunt init

      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------

      - name: Terragrunt Validate
        run: terragrunt validate


      # --------------------------------------------------
      # Setup TFLint
      # --------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v1


      # --------------------------------------------------
      # TFLint
      # --------------------------------------------------

      - name: Initialize TFLint
        working-directory: .
        run: tflint --init


      - name: Run TFLint
        working-directory: .
        run: tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --recursive

      # --------------------------------------------------
      # Checkov
      # --------------------------------------------------

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false
          skip_check: CK*


      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        run: terragrunt plan -input=false
